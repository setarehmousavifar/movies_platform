{% extends 'base.html' %}
{% load static %}

{% block title %}Login · Movie Platform{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1 class="page-title text-center">Login</h1>
      <form method="post" class="auth-panel">
        {% csrf_token %}
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="fas fa-user"></i></span>
            <input type="text" id="username" name="username" class="form-control" placeholder="Username" autocomplete="username" value="{% if form.username.value %}{{ form.username.value }}{% endif %}">
          </div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="fas fa-lock"></i></span>
            <input type="password" id="password" name="password" class="form-control" placeholder="Password" autocomplete="current-password">
          </div>
        </div>
        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me">
          <label class="form-check-label" for="remember_me">Remember Me</label>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
      </form>
      <div class="text-center mt-3">
        <a href="{% url 'password_reset' %}">Forgot your password?</a>
      </div>
      <div class="text-center mt-2">
        <p class="detail-muted">Don't have an account? <a href="{% url 'register' %}">Sign up here</a>.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
