{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Notifications</h1>
    <ul class="list-group">
        {% for n in notifications %}
        <li class="list-group-item d-flex justify-content-between align-items-start {% if not n.is_read %}list-group-item-warning{% endif %}">
            <div>
                <div>{{ n.message }}</div>
                <small class="text-muted">{{ n.sent_date }}</small>
            </div>
            {% if not n.is_read %}
            <form method="post" action="{% url 'notification_mark_read' n.id %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-primary">Mark read</button>
            </form>
            {% else %}
            <span class="badge bg-success">Read</span>
            {% endif %}
        </li>
        {% empty %}
        <li class="list-group-item">No notifications yet.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
