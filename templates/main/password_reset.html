{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center">Password Recovery</h1>
    <p class="text-center">Enter your email address below to reset your password.</p>

    <form method="post" class="p-4 border rounded bg-light shadow-sm">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_email" class="form-label">Email Address</label>
            <input type="email" name="email" id="id_email" class="form-control"
                   value="{{ form.email.value|default:'' }}" required
                   placeholder="Enter your email address">
            {% if form.email.errors %}
                <div class="text-danger">{{ form.email.errors }}</div>
            {% endif %}
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-primary">Send Recovery Email</button>
        </div>
        <div class="text-center mt-3">
            <a href="{% url 'login' %}" class="text-decoration-none">Back to Login</a>
        </div>
    </form>
</div>
{% endblock %}
