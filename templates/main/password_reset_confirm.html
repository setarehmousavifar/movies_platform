{% extends 'base.html' %}
{% load static %}

{% block title %}New Password · Movie Platform{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1 class="page-title text-center">Set a New Password</h1>
      <form method="post" class="auth-panel">
        {% csrf_token %}
        <div class="mb-3">
          <label for="id_new_password1" class="form-label">New Password</label>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="fas fa-lock"></i></span>
            <input type="password" name="new_password1" id="id_new_password1" class="form-control" placeholder="New password" autocomplete="new-password">
          </div>
        </div>
        <div class="mb-3">
          <label for="id_new_password2" class="form-label">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="fas fa-lock"></i></span>
            <input type="password" name="new_password2" id="id_new_password2" class="form-control" placeholder="Confirm password" autocomplete="new-password">
          </div>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Set Password</button>
        </div>
      </form>
      <div class="text-center mt-3">
        <p class="detail-muted">Remembered your password? <a href="{% url 'login' %}">Login</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
