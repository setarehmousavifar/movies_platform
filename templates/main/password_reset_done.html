{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Sent · Movie Platform{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1 class="page-title text-center">Check Your Email</h1>
      <div class="auth-panel text-center">
        <p class="mb-0">If an account exists for that address, we sent a reset link. Follow it to choose a new password.</p>
      </div>
      <div class="text-center mt-3">
        <a href="{% url 'login' %}" class="btn btn-primary">Back to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
