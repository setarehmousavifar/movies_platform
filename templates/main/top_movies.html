{% extends 'base.html' %}
{% load static %}

{% block title %}Top Movies{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Top Movies</h1>
    <ul class="list-group">
        {% for movie in top_movies %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <a href="{% url 'movie_detail' movie.id %}">{{ movie.title }}</a>
                <span>Rating: {{ movie.overall_rating }}</span>
            </li>
        {% empty %}
            <li class="list-group-item">No movies yet.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
