{# Expects: action (url), genres queryset #}
<form action="{{ action }}" method="get" class="row g-3 mb-4 catalog-filters">
  <div class="col-md-4">
    <label class="form-label visually-hidden" for="id_query">Search</label>
    <input id="id_query" type="text" name="query" placeholder="Search by title or description" class="form-control" value="{{ request.GET.query }}">
  </div>
  <div class="col-md-3">
    <label class="form-label visually-hidden" for="id_genre">Genre</label>
    <select id="id_genre" name="genre" class="form-select">
      <option value="">All Genres</option>
      {% for genre in genres %}
      <option value="{{ genre.id }}" {% if genre.id|stringformat:"s" == request.GET.genre %}selected{% endif %}>
        {{ genre.genre_name }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-2">
    <label class="form-label visually-hidden" for="id_rating">Rating</label>
    <select id="id_rating" name="rating" class="form-select">
      <option value="">All Ratings</option>
      <option value="9" {% if request.GET.rating == "9" %}selected{% endif %}>Above 9</option>
      <option value="8" {% if request.GET.rating == "8" %}selected{% endif %}>Above 8</option>
      <option value="7" {% if request.GET.rating == "7" %}selected{% endif %}>Above 7</option>
      <option value="6" {% if request.GET.rating == "6" %}selected{% endif %}>Above 6</option>
      <option value="5" {% if request.GET.rating == "5" %}selected{% endif %}>Above 5</option>
      <option value="4" {% if request.GET.rating == "4" %}selected{% endif %}>Below 5</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label visually-hidden" for="id_sort_by">Sort</label>
    <select id="id_sort_by" name="sort_by" class="form-select">
      <option value="">Sort By</option>
      <option value="newest" {% if request.GET.sort_by == "newest" %}selected{% endif %}>Newest</option>
      <option value="popular" {% if request.GET.sort_by == "popular" %}selected{% endif %}>Most Popular</option>
      <option value="release_year" {% if request.GET.sort_by == "release_year" %}selected{% endif %}>Release Year</option>
    </select>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Search</button>
  </div>
</form>
