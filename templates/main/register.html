{% extends 'base.html' %}
{% load static %}

{% block title %}Sign Up · Movie Platform{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1 class="page-title text-center">Sign Up</h1>
      <form method="post" class="auth-panel">
        {% csrf_token %}
        <div class="row mb-3">
          <div class="col">
            <label for="first_name" class="form-label">First Name</label>
            <div class="input-group">
              <span class="input-group-text" aria-hidden="true"><i class="fas fa-user"></i></span>
              <input type="text" id="first_name" name="first_name" class="form-control" placeholder="First Name" autocomplete="given-name">
            </div>
          </div>
          <div class="col">
            <label for="last_name" class="form-label">Last Name</label>
            <div class="input-group">
              <span class="input-group-text" aria-hidden="true"><i class="fas fa-user"></i></span>
              <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Last Name" autocomplete="family-name">
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="fas fa-user-circle"></i></span>
            <input type="text" id="username" name="username" class="form-control" placeholder="Username" autocomplete="username">
          </div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="fas fa-envelope"></i></span>
            <input type="email" id="email" name="email" class="form-control" placeholder="Email Address" autocomplete="email">
          </div>
        </div>
        <div class="mb-3">
          <label for="phone_number" class="form-label">Phone</label>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="fas fa-phone"></i></span>
            <input type="text" id="phone_number" name="phone_number" class="form-control" placeholder="Phone Number" autocomplete="tel">
          </div>
        </div>
        <div class="mb-3">
          <label for="password1" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="fas fa-lock"></i></span>
            <input type="password" id="password1" name="password1" class="form-control" placeholder="Password" autocomplete="new-password">
          </div>
        </div>
        <div class="mb-3">
          <label for="password2" class="form-label">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="fas fa-lock"></i></span>
            <input type="password" id="password2" name="password2" class="form-control" placeholder="Confirm Password" autocomplete="new-password">
          </div>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Sign Up</button>
        </div>
      </form>
      <div class="text-center mt-3">
        <p class="detail-muted">Already have an account? <a href="{% url 'login' %}">Login</a></p>
        <a href="{% url 'home' %}" class="btn btn-outline-light btn-sm">Back to Home</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
