{% extends 'base.html' %}
{% load static %}

{% block title %}Password Updated · Movie Platform{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1 class="page-title text-center">Password Updated</h1>
      <div class="auth-panel text-center">
        <p class="mb-0">Your password has been changed. You can sign in with the new credentials.</p>
      </div>
      <div class="text-center mt-3">
        <a href="{% url 'login' %}" class="btn btn-primary">Log In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
