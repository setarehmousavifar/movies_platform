{% extends 'base.html' %}
{% load static %}

{% block title %}Genres · Movie Platform{% endblock %}

{% block content %}
<div class="container py-4">
  <h1 class="page-title">Genres</h1>
  <ul class="list-group panel-list">
    {% for genre in genres %}
    <li class="list-group-item">
      <a href="{% url 'movies_by_genre' genre.id %}">{{ genre.genre_name }}</a>
    </li>
    {% empty %}
    <li class="list-group-item"><div class="empty-state mb-0">No genres available.</div></li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
